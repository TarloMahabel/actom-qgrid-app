<svg xmlns="http://www.w3.org/2000/svg" width="480" height="170" font-family="system-ui,sans-serif">
  <rect width="480" height="170" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Header -->
  <rect width="480" height="28" rx="6" fill="#3B6FA8"/>
  <rect y="22" width="480" height="6" fill="#3B6FA8"/>
  <text x="12" y="18" fill="#FFFFFF" font-size="11" font-weight="600">Inspection reports</text>
  <!-- Tab bar -->
  <rect y="28" width="480" height="22" fill="#F4F6F9"/>
  <rect x="8" y="31" width="56" height="16" rx="3" fill="#FFFFFF"/>
  <text x="36" y="43" fill="#3B6FA8" font-size="10" font-weight="600" text-anchor="middle">Overview</text>
  <text x="78" y="43" fill="#4F5D72" font-size="10">Faults per project</text>
  <text x="175" y="43" fill="#4F5D72" font-size="10">Actions</text>
  <text x="216" y="43" fill="#4F5D72" font-size="10">Pass rate by stage</text>
  <text x="312" y="43" fill="#4F5D72" font-size="10">★ Favourites</text>
  <!-- Content area -->
  <rect y="50" width="480" height="120" fill="#FAFBFC"/>
  <!-- Y axis -->
  <line x1="46" y1="55" x2="46" y2="140" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="59" fill="#4F5D72" font-size="8" text-anchor="end">40</text>
  <line x1="46" y1="79" x2="430" y2="79" stroke="#F1F5F9" stroke-width="1"/>
  <text x="40" y="83" fill="#4F5D72" font-size="8" text-anchor="end">20</text>
  <line x1="46" y1="109" x2="430" y2="109" stroke="#F1F5F9" stroke-width="1"/>
  <text x="40" y="113" fill="#4F5D72" font-size="8" text-anchor="end">0</text>
  <!-- Bars: 6 months, each pair: blue=completed, orange=first pass -->
  <!-- May -->
  <rect x="54" y="73" width="16" height="36" fill="#3B6FA8" rx="2"/>
  <rect x="72" y="85" width="16" height="24" fill="#A2643A" rx="2"/>
  <text x="68" y="148" fill="#4F5D72" font-size="8" text-anchor="middle">May</text>
  <!-- Jun -->
  <rect x="114" y="67" width="16" height="42" fill="#3B6FA8" rx="2"/>
  <rect x="132" y="79" width="16" height="30" fill="#A2643A" rx="2"/>
  <text x="128" y="148" fill="#4F5D72" font-size="8" text-anchor="middle">Jun</text>
  <!-- Jul -->
  <rect x="174" y="71" width="16" height="38" fill="#3B6FA8" rx="2"/>
  <rect x="192" y="83" width="16" height="26" fill="#A2643A" rx="2"/>
  <text x="188" y="148" fill="#4F5D72" font-size="8" text-anchor="middle">Jul</text>
  <!-- Aug -->
  <rect x="234" y="63" width="16" height="46" fill="#3B6FA8" rx="2"/>
  <rect x="252" y="77" width="16" height="32" fill="#A2643A" rx="2"/>
  <text x="248" y="148" fill="#4F5D72" font-size="8" text-anchor="middle">Aug</text>
  <!-- Sep -->
  <rect x="294" y="69" width="16" height="40" fill="#3B6FA8" rx="2"/>
  <rect x="312" y="79" width="16" height="30" fill="#A2643A" rx="2"/>
  <text x="308" y="148" fill="#4F5D72" font-size="8" text-anchor="middle">Sep</text>
  <!-- Oct -->
  <rect x="354" y="75" width="16" height="34" fill="#3B6FA8" rx="2"/>
  <rect x="372" y="85" width="16" height="24" fill="#A2643A" rx="2"/>
  <text x="368" y="148" fill="#4F5D72" font-size="8" text-anchor="middle">Oct</text>
  <!-- Legend -->
  <rect x="400" y="70" width="8" height="8" fill="#3B6FA8" rx="1"/>
  <text x="412" y="78" fill="#4F5D72" font-size="8">Completed</text>
  <rect x="400" y="84" width="8" height="8" fill="#A2643A" rx="1"/>
  <text x="412" y="92" fill="#4F5D72" font-size="8">First Pass</text>
</svg>
