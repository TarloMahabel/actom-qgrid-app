<svg xmlns="http://www.w3.org/2000/svg" width="480" height="170" font-family="system-ui,sans-serif">
  <rect width="480" height="170" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Header -->
  <rect width="480" height="28" rx="6" fill="#2F7F7A"/>
  <rect y="22" width="480" height="6" fill="#2F7F7A"/>
  <text x="12" y="18" fill="#FFFFFF" font-size="11" font-weight="600">Form designer</text>
  <!-- Tab bar (empty) -->
  <rect y="28" width="480" height="22" fill="#F4F6F9"/>
  <!-- Content -->
  <rect y="50" width="480" height="120" fill="#FAFBFC"/>
  <!-- Form field row 1 -->
  <rect x="8" y="56" width="464" height="26" rx="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="18" y="73" fill="#1E293B" font-size="10">Visual inspection</text>
  <rect x="330" y="60" width="36" height="16" rx="8" fill="#2F7F7A"/>
  <text x="348" y="72" fill="#FFFFFF" font-size="9" text-anchor="middle">Yes</text>
  <rect x="370" y="60" width="36" height="16" rx="8" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="388" y="72" fill="#4F5D72" font-size="9" text-anchor="middle">No</text>
  <!-- Form field row 2 -->
  <rect x="8" y="88" width="464" height="26" rx="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="18" y="105" fill="#1E293B" font-size="10">Insulation resistance (MΩ)</text>
  <rect x="310" y="92" width="80" height="16" rx="3" fill="#FAFBFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="350" y="104" fill="#4F5D72" font-size="9" text-anchor="middle">value</text>
  <text x="398" y="104" fill="#4F5D72" font-size="9">≥ 1.0</text>
  <!-- Form field row 3 -->
  <rect x="8" y="120" width="464" height="26" rx="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="18" y="137" fill="#1E293B" font-size="10">Photo evidence</text>
  <!-- camera icon simple -->
  <rect x="310" y="124" width="20" height="14" rx="2" fill="#4F5D72"/>
  <circle cx="320" cy="131" r="4" fill="#FAFBFC"/>
  <circle cx="320" cy="131" r="2" fill="#4F5D72"/>
  <text x="336" y="137" fill="#4F5D72" font-size="9">(1 required)</text>
  <!-- Dashed add field -->
  <rect x="8" y="152" width="464" height="14" rx="3" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="240" y="162" fill="#4F5D72" font-size="9" text-anchor="middle">+ Add field...</text>
</svg>
