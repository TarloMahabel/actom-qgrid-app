  <text x="280" y="64" fill="#4F5D72" font-size="9" font-weight="600">Status</text>
  <text x="400" y="64" fill="#4F5D72" font-size="9" font-weight="600">Dept</text>
  <line x1="8" y1="67" x2="472" y2="67" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Row 1 -->
  <rect x="0" y="67" width="480" height="28" fill="#FFFFFF"/>
  <text x="12" y="85" fill="#1E293B" font-size="10" font-weight="600">NCR-26-0001</text>
  <text x="90" y="85" fill="#1E293B" font-size="10">Material out of spec</text>
  <rect x="278" y="74" width="82" height="14" rx="3" fill="#EEF2FF"/>
