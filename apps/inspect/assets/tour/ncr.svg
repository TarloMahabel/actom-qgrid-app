  <!-- Row 3 -->
  <rect x="0" y="123" width="480" height="28" fill="#FFFFFF"/>
  <text x="12" y="141" fill="#1E293B" font-size="10" font-weight="600">NCR-26-0003</text>
  <text x="90" y="141" fill="#1E293B" font-size="10">Weld visual fail</text>
