  <rect width="480" height="28" rx="6" fill="#8A5273"/>
  <rect y="22" width="480" height="6" fill="#8A5273"/>
  <text x="12" y="18" fill="#FFFFFF" font-size="11" font-weight="600">NCR management</text>
