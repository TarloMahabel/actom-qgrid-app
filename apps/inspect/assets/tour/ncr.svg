  <text x="76" y="43" fill="#4F5D72" font-size="10">Repeat causes</text>
  <text x="152" y="43" fill="#4F5D72" font-size="10">By department</text>
  <text x="232" y="43" fill="#4F5D72" font-size="10">By supplier</text>
  <!-- Content -->
  <rect y="50" width="480" height="120" fill="#FAFBFC"/>
  <!-- Column headers -->
  <text x="12" y="64" fill="#4F5D72" font-size="9" font-weight="600">Ref</text>
