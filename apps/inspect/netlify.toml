# =====================================================================
# ACTOM QGrid — INSPECTION APP
#
# One Netlify site per division, all deploying the same commit from the
# production branch. What differs is four environment variables:
#
#   SUPABASE_URL        https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY   public anon key — RLS is the control, not secrecy
#   DIVISION_CODE       MVS
#   DIVISION_NAME       ACTOM MV Switchgear
#
# ---------------------------------------------------------------------
# WHY THERE IS A BUILD COMMAND IN A NO-BUILD-STEP PROJECT
#
# The app itself needs no compilation. The command exists only to write
# two files that cannot be committed because they differ per division:
# config.js, and _headers carrying a CSP whose connect-src names that
# division's Supabase project. See scripts/gen-config.mjs.
#
# The generated _headers is applied ON TOP of the policies below, and
# takes precedence for Content-Security-Policy.
# ---------------------------------------------------------------------

[build]
  publish = "."
  command = "node ../../scripts/gen-config.mjs"
  base    = "apps/inspect"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    # A conservative baseline. The generated _headers replaces the
    # Content-Security-Policy with one that pins connect-src to this
    # division's project; if generation ever fails, this policy leaves the
    # app unable to reach any backend, which is the safe way to fail.
    Content-Security-Policy = """
      default-src 'none';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob:;
      connect-src 'self';
      form-action 'none';
      frame-ancestors 'none';
      base-uri 'none';
      object-src 'none';
      upgrade-insecure-requests
    """
    Strict-Transport-Security    = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options       = "nosniff"
    X-Frame-Options              = "DENY"
    Referrer-Policy              = "no-referrer"
    Cross-Origin-Opener-Policy   = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # The camera is needed: inspectors photograph defects on a tablet.
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=()"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

# Inspection records are quality evidence. Nothing is cached.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"

# The vendored client is pinned and versioned by commit, so it can be
# cached hard. This is most of the payload on a slow shop-floor link.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
