# =====================================================================
# ACTOM QGrid — Netlify configuration
#
# THIS FILE MUST LIVE AT THE REPOSITORY ROOT.
#
# Netlify reads netlify.toml from the root of the repository, and nowhere
# else, unless a base directory is set in the site UI. The Apprenticeship
# Portal keeps a netlify.toml inside each app, which works because its
# sites have the base directory set by hand — an extra manual step, and
# the reason the first QGrid deploy served a 404: the file sat in
# apps/inspect/, Netlify never read it, published the repo root, found no
# index.html there and 404'd.
#
# One app, one root file, no UI configuration to forget. If a second app
# is ever added, that one takes the base-directory-in-UI route and this
# file keeps serving apps/inspect.
#
# ---------------------------------------------------------------------
# ONE SITE PER DIVISION. All deploy the same commit from the production
# branch. What differs is four environment variables:
#
#   SUPABASE_URL        https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY   public anon key — RLS is the control, not secrecy
#   DIVISION_CODE       MVS
#   DIVISION_NAME       ACTOM MV Switchgear
#
# WHY THERE IS A BUILD COMMAND IN A NO-BUILD-STEP PROJECT
#
# The app needs no compilation. The command writes two files that cannot
# be committed because they differ per division: config.js, and _headers
# carrying the Content-Security-Policy, whose connect-src names that
# division's Supabase project. See scripts/gen-config.mjs.
#
# The CSP is defined ONLY in that generated file. If the build fails, no
# CSP is sent at all — which is worse than a strict one, so the build is
# written to fail loudly rather than publish a half-configured site.
# =====================================================================

[build]
  command = "node scripts/gen-config.mjs"
  publish = "apps/inspect"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    # ------------------------------------------------------------------
    # NO Content-Security-Policy HERE. Deliberately.
    #
    # netlify.toml TAKES PRECEDENCE over the generated _headers file for
    # the same header on the same path. An earlier version defined the CSP
    # here as a multi-line TOML string:
    #
    #     Content-Security-Policy = """
    #       default-src 'none';
    #       script-src 'self';
    #       ...
    #     """
    #
    # An HTTP header cannot contain newlines. The value was mangled down to
    # roughly "default-src 'none'" — which blocks scripts, styles and every
    # request — and because this file wins, it overrode the correct
    # single-line policy that scripts/gen-config.mjs writes to _headers.
    # The app served a splash screen that never advanced, with nothing in
    # the console except a manifest warning.
    #
    # The CSP belongs in the generated file anyway: connect-src has to name
    # this division's Supabase project, which is not known until build time.
    # ------------------------------------------------------------------
    Strict-Transport-Security    = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options       = "nosniff"
    X-Frame-Options              = "DENY"
    Referrer-Policy              = "no-referrer"
    Cross-Origin-Opener-Policy   = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # The camera is needed: inspectors photograph defects on a tablet.
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=()"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

# Inspection records are quality evidence. Nothing is cached.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"

# The vendored client is pinned and changes only by commit, so it can be
# cached hard. It is most of the payload on a slow shop-floor link.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
